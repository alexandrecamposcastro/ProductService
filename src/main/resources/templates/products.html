<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AC | Product Service</title>
    <style>
        :root { --accent: #10b981; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 40px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 20px; }
        input { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; margin-right: 10px; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #94a3b8; padding: 12px; border-bottom: 2px solid #334155; }
        td { padding: 12px; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px">
            <h1>Product Service <small style="color:var(--accent); font-size:14px">Port: 8082</small></h1>
        </div>

        <div class="card">
            <form th:action="@{/}" method="get" style="display:flex; gap:10px">
                <input type="text" name="search" placeholder="Pesquisar produto..." style="flex-grow:1">
                <button type="submit" style="background:#334155">Buscar</button>
            </form>
        </div>

        <div class="card">
            <h3 th:text="${newProduct.id != null ? 'Editar Produto' : 'Novo Produto'}"></h3>
            <form th:action="@{/save}" th:object="${newProduct}" method="post">
                <input type="hidden" th:field="*{id}">
                <input type="text" th:field="*{name}" placeholder="Nome do Item" required>
                <input type="number" step="0.01" th:field="*{price}" placeholder="Preço R$">
                <input type="number" th:field="*{stock}" placeholder="Estoque">
                <button type="submit">Salvar</button>
            </form>
        </div>

        <div class="card">
            <table>
                <thead><tr><th>ID</th><th>NOME</th><th>PREÇO</th><th>ESTOQUE</th><th>AÇÕES</th></tr></thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.name}" style="font-weight:bold"></td>
                        <td th:text="'R$ ' + ${p.price}"></td>
                        <td th:text="${p.stock}"></td>
                        <td>
                            <a th:href="@{'/edit/' + ${p.id}}" style="color:var(--accent); text-decoration:none; margin-right:15px">Editar</a>
                            <a th:href="@{'/delete/' + ${p.id}}" style="color:#ef4444; text-decoration:none">Excluir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
